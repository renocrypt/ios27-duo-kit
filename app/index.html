    <p>A web UI kit for iPhone Duo, Apple's foldable, and iOS 27: a 3D model of the device that folds, its system UI in HTML and SVG, and Liquid Glass rendered in WebGL and fitted to the iOS 27.1 simulator. This page, "a day with Duo," follows one day across the device's poses. It needs JavaScript and WebGL; the screens need Chrome with chrome://flags/#canvas-draw-element on.</p>
